name: 🚀 Build & Release OpenGOAL Mod Package

# Manual only (workflow_dispatch), by design usable from any branch: there is
# no `branches:` restriction on workflow_dispatch, so any branch that carries
# this file (every mod branch does, see scripts/modding/sync_common.py) can
# be picked with "Use workflow from" in the Actions tab and released
# directly, no need to be on master/master-dev first.
#
# Restricted to the repository owner (see the `authorize` job) - this builds
# and publishes real, player-facing binaries and pushes to the repo, so only
# the owner may trigger it, regardless of who else has write access.

on:
  workflow_dispatch:
    inputs:
      mod_name:
        description: 'Mod display name (e.g. Jak 3 JetBoard). Empty: the name of the last release (index.json)'
        required: false
      mod_description:
        description: 'Short mod description (included as-is in index.json). Empty: the description of the last release (index.json), else the README'
        required: false
      tag_name:
        description: 'Mod version tag, required (e.g. v1.0.0)'
        required: true
      changelog:
        description: 'Optional: path in the repository to a Markdown changelog (e.g. docs/changelog/v1.1.0.md), added to the release notes and attached to the release'
        required: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # =========================================================================
  # OWNER-ONLY GATE
  #
  # workflow_dispatch already requires write access to see/trigger this
  # workflow, but that only means "any collaborator with write access" - this
  # narrows it further to specifically the repository owner. Every other job
  # depends on this one (directly or transitively via check_mode), so an
  # unauthorized actor never gets as far as checking out the repo.
  # =========================================================================
  authorize:
    name: "🔒 Verify Authorized Actor"
    runs-on: ubuntu-latest
    steps:
      - name: Restrict to repository owner
        if: github.actor != github.repository_owner
        run: |
          echo "::error::This workflow may only be run by the repository owner (${{ github.repository_owner }}). Triggered by: ${{ github.actor }}."
          exit 1

  # =========================================================================
  # 0. VERSION / METADATA RESOLUTION
  #
  # This workflow no longer offers a "recompile or not" choice: a release
  # always rebuilds Windows + Linux from source. That is a deliberate choice
  # - a mod shipped without ever going through a full compile is exactly the
  # kind of release we don't want to distribute to players. The version tag
  # is `required: true` on workflow_dispatch (see above), so there is no
  # "auto" value to detect here, only the metadata provided by whoever
  # triggers the release. An empty name or description reuses the last
  # release's, from the branch's index.json.
  # =========================================================================
  check_mode:
    name: "🔍 Resolve Version & Metadata"
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      display_name: ${{ steps.meta.outputs.display_name }}
      description: ${{ steps.meta.outputs.description }}
      target_branch: ${{ steps.meta.outputs.target_branch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Resolve Version and Metadata
        id: meta
        env:
          INPUT_MOD_NAME: ${{ github.event.inputs.mod_name }}
          INPUT_MOD_DESC: ${{ github.event.inputs.mod_description }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          TARGET_BRANCH="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag detected: identify the associated origin/jak* branch
            RESOLVED=$(git branch -r --contains HEAD | grep -E 'origin/jak[123]/' | head -n 1 | sed 's/^[[:space:]]*origin\///')
            if [ -n "$RESOLVED" ]; then
              echo "Tag detected (${{ github.ref_name }}), resolved parent branch: $RESOLVED"
              TARGET_BRANCH="$RESOLVED"
            fi
          fi
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

          python ./scripts/modding/update_mod_catalog.py \
            --branch "$TARGET_BRANCH" \
            --tag "$INPUT_TAG_NAME" \
            --display-name "$INPUT_MOD_NAME" \
            --description "$INPUT_MOD_DESC" \
            --export-github-output

  # =========================================================================
  # 1. BUILD WINDOWS (always, see the note on the full rebuild above)
  # =========================================================================
  build-windows:
    name: "🖥️ Windows (Clang-CL Static)"
    needs: check_mode
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install NASM
        run: choco install nasm

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: windows-release-static-${{ github.sha }}
          restore-keys: windows-release-static-

      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Remove Strawberry Perl from PATH
        run: |
          $env:PATH = $env:PATH -replace "C:\\Strawberry\\c\\bin;", ""
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build --preset=Release-windows-clang-static ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Binaries (gk, goalc, extractor only)
        shell: cmd
        run: cmake --build build --config Release --target gk --target goalc --target extractor --parallel %NUMBER_OF_PROCESSORS%

      # A mod made with scripts/level_port (custom_assets/<game>/ports/<port>/port.jsonc) ships
      # nothing of its source game: its extractor runs the port at install time, on the player's
      # own discs (decompiler/extractor/main.cpp, run_level_ports). It needs level_port (a one-file
      # executable) and fr3_check next to it. Mods without a port skip these steps.
      - name: Detect Level Ports
        id: ports
        shell: bash
        run: |
          if compgen -G "custom_assets/*/ports/*/port.jsonc" > /dev/null; then
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python (level ports)
        if: steps.ports.outputs.found == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build level_port and fr3_check (level ports)
        if: steps.ports.outputs.found == 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target fr3_check
          python -m pip install pyinstaller
          echo "from level_port.__main__ import main; main()" > level_port_entry.py
          # PYTHONPATH: --collect-submodules imports the package to list the modules the manifest
          # loads by name (games/, convert/)
          PYTHONPATH=scripts python -m PyInstaller --onefile --name level_port --paths scripts \
            --collect-submodules level_port --distpath build/level_port level_port_entry.py

      # A mod whose models come from the games' discs (custom_assets/<game>/models/models.jsonc)
      # ships no model: it ships the tool that makes them at the player's install, a one-file
      # executable next to the extractor, which runs it before its decompile
      # (decompiler/extractor/main.cpp, run_mod_models; scripts/modding/mod_models.py)
      - name: Set up Python (mod models)
        if: hashFiles('custom_assets/*/models/models.jsonc') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build mod_models (models made at install)
        if: hashFiles('custom_assets/*/models/models.jsonc') != ''
        shell: bash
        run: |
          python -m pip install pyinstaller numpy
          python -m PyInstaller --onefile --name mod_models --distpath build/mod_models scripts/modding/mod_models.py

      - name: Package Windows Mod Bundle
        shell: bash
        run: |
          TAG_VAL="${{ needs.check_mode.outputs.release_tag }}"
          PKG_DIR="dist_windows"
          mkdir -p "$PKG_DIR/data/launcher"
          mkdir -p "$PKG_DIR/data/decompiler"
          mkdir -p "$PKG_DIR/data/game/graphics/opengl_renderer"

          cp build/bin/gk.exe "$PKG_DIR/"
          cp build/bin/goalc.exe "$PKG_DIR/"
          cp build/bin/extractor.exe "$PKG_DIR/"
          if [ -f build/mod_models/mod_models.exe ]; then
            cp build/mod_models/mod_models.exe "$PKG_DIR/"
          fi
          # level ports (see "Detect Level Ports"): the port, fr3_check, and the texture pool
          # layout the port reads (game/graphics/texture/<game>_tpage_dir.cpp)
          if [ -f build/level_port/level_port.exe ]; then
            cp build/level_port/level_port.exe build/bin/fr3_check.exe "$PKG_DIR/"
            mkdir -p "$PKG_DIR/data/game/graphics/texture"
            cp game/graphics/texture/*_tpage_dir.cpp "$PKG_DIR/data/game/graphics/texture/"
          fi

          cp -r decompiler/config "$PKG_DIR/data/decompiler/"
          cp -r goal_src "$PKG_DIR/data/"
          cp -r game/assets "$PKG_DIR/data/game/"
          cp -r game/graphics/opengl_renderer/shaders "$PKG_DIR/data/game/graphics/opengl_renderer/"

          if [ -d "custom_assets" ]; then
            cp -r custom_assets "$PKG_DIR/data/"
          fi

          if [ -f ".github/scripts/releases/error-code-metadata.json" ]; then
            cp .github/scripts/releases/error-code-metadata.json "$PKG_DIR/data/launcher/"
          fi

          mkdir -p final-artifacts
          cd "$PKG_DIR"
          7z a -tzip "../final-artifacts/windows-${TAG_VAL}.zip" *
          cd ..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: final-artifacts/*.zip
          if-no-files-found: error

  # =========================================================================
  # 2. BUILD LINUX (always, see the note on the full rebuild at the top of the file)
  # =========================================================================
  build-linux:
    name: "🐧 Linux (Clang Static)"
    needs: check_mode
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang gcc g++ nasm \
            libxrandr-dev libxinerama-dev libxcursor-dev libpulse-dev \
            libxi-dev libgl1-mesa-dev libssl-dev ninja-build zip

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: linux-release-static-${{ github.sha }}
          restore-keys: linux-release-static-

      - name: Configure CMake
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build --preset=Release-linux-clang-static \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Binaries (gk, goalc, extractor only)
        run: cmake --build build --config Release --target gk --target goalc --target extractor --parallel $(nproc)

      - name: Strip Binaries
        run: |
          strip build/game/gk
          strip build/goalc/goalc
          strip build/decompiler/extractor

      # level ports: see the Windows job's "Detect Level Ports"
      - name: Detect Level Ports
        id: ports
        run: |
          if compgen -G "custom_assets/*/ports/*/port.jsonc" > /dev/null; then
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python (level ports)
        if: steps.ports.outputs.found == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build level_port and fr3_check (level ports)
        if: steps.ports.outputs.found == 'true'
        run: |
          cmake --build build --config Release --target fr3_check --parallel $(nproc)
          strip build/tools/fr3_check
          python -m pip install pyinstaller
          echo "from level_port.__main__ import main; main()" > level_port_entry.py
          PYTHONPATH=scripts python -m PyInstaller --onefile --name level_port --paths scripts \
            --collect-submodules level_port --distpath build/level_port level_port_entry.py

      # A mod whose models come from the games' discs (custom_assets/<game>/models/models.jsonc)
      # ships no model: it ships the tool that makes them at the player's install, a one-file
      # executable next to the extractor, which runs it before its decompile
      # (decompiler/extractor/main.cpp, run_mod_models; scripts/modding/mod_models.py)
      - name: Set up Python (mod models)
        if: hashFiles('custom_assets/*/models/models.jsonc') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build mod_models (models made at install)
        if: hashFiles('custom_assets/*/models/models.jsonc') != ''
        shell: bash
        run: |
          python -m pip install pyinstaller numpy
          python -m PyInstaller --onefile --name mod_models --distpath build/mod_models scripts/modding/mod_models.py

      - name: Package Linux Mod Bundle
        run: |
          TAG_VAL="${{ needs.check_mode.outputs.release_tag }}"
          PKG_DIR="dist_linux"
          mkdir -p "$PKG_DIR/data/launcher"
          mkdir -p "$PKG_DIR/data/decompiler"
          mkdir -p "$PKG_DIR/data/game/graphics/opengl_renderer"

          cp build/game/gk "$PKG_DIR/"
          cp build/goalc/goalc "$PKG_DIR/"
          cp build/decompiler/extractor "$PKG_DIR/"
          if [ -f build/mod_models/mod_models ]; then
            cp build/mod_models/mod_models "$PKG_DIR/"
            chmod +x "$PKG_DIR/mod_models"
          fi
          # level ports: see the Windows job's package step
          if [ -f build/level_port/level_port ]; then
            cp build/level_port/level_port build/tools/fr3_check "$PKG_DIR/"
            chmod +x "$PKG_DIR/level_port" "$PKG_DIR/fr3_check"
            mkdir -p "$PKG_DIR/data/game/graphics/texture"
            cp game/graphics/texture/*_tpage_dir.cpp "$PKG_DIR/data/game/graphics/texture/"
          fi
          chmod +x "$PKG_DIR/gk" "$PKG_DIR/goalc" "$PKG_DIR/extractor"

          cp -r decompiler/config "$PKG_DIR/data/decompiler/"
          cp -r goal_src "$PKG_DIR/data/"
          cp -r game/assets "$PKG_DIR/data/game/"
          cp -r game/graphics/opengl_renderer/shaders "$PKG_DIR/data/game/graphics/opengl_renderer/"

          if [ -d "custom_assets" ]; then
            cp -r custom_assets "$PKG_DIR/data/"
          fi

          if [ -f ".github/scripts/releases/error-code-metadata.json" ]; then
            cp .github/scripts/releases/error-code-metadata.json "$PKG_DIR/data/launcher/"
          fi

          mkdir -p final-artifacts
          cd "$PKG_DIR"
          zip -r "../final-artifacts/linux-${TAG_VAL}.zip" ./*
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: final-artifacts/*.zip
          if-no-files-found: error

  # =========================================================================
  # 3. RELEASE PUBLICATION & MOD CATALOG (index.json)
  # =========================================================================
  publish:
    name: "📦 Publish Release & Catalog"
    needs: [check_mode, build-windows, build-linux]
    if: always() && !cancelled() && needs.check_mode.result == 'success' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded-artifacts

      - name: Compute Checksums & Prepare Assets
        id: checksums
        env:
          RELEASE_TAG: ${{ needs.check_mode.outputs.release_tag }}
        run: |
          mkdir -p release-files
          find downloaded-artifacts -type f -name "*.zip" -exec mv {} release-files/ \;

          # Include any mod texture packs located in docs/modding/current_mod/texture_packs/
          if [ -d "docs/modding/current_mod/texture_packs" ]; then
            echo "Scanning for texture packs in docs/modding/current_mod/texture_packs/..."
            find docs/modding/current_mod/texture_packs -type f -name "*.zip" -exec cp -v {} release-files/ \;
          fi

          cd release-files
          # Compute checksums for all packages (binaries and texture packs)
          sha256sum *.zip > SHA256SUMS.txt
          echo "=== SHA-256 CHECKSUMS ==="
          cat SHA256SUMS.txt

          WIN_HASH=$(sha256sum "windows-${RELEASE_TAG}.zip" | awk '{print $1}')
          LIN_HASH=$(sha256sum "linux-${RELEASE_TAG}.zip" | awk '{print $1}')
          echo "win_sha=$WIN_HASH" >> $GITHUB_OUTPUT
          echo "lin_sha=$LIN_HASH" >> $GITHUB_OUTPUT
          cd ..

      - name: Generate Mod Catalog (index.json)
        env:
          RELEASE_TAG: ${{ needs.check_mode.outputs.release_tag }}
          TARGET_BRANCH: ${{ needs.check_mode.outputs.target_branch }}
          DISPLAY_NAME: ${{ needs.check_mode.outputs.display_name }}
          DESCRIPTION: ${{ needs.check_mode.outputs.description }}
        run: |
          python ./scripts/modding/update_mod_catalog.py \
            --tag "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --branch "${TARGET_BRANCH}" \
            --display-name "${DISPLAY_NAME}" \
            --description "${DESCRIPTION}" \
            --win-sha "${{ steps.checksums.outputs.win_sha }}" \
            --lin-sha "${{ steps.checksums.outputs.lin_sha }}" \
            --index-file "./index.json"

          cp index.json release-files/

      - name: Generate Release Notes
        env:
          RELEASE_TAG: ${{ needs.check_mode.outputs.release_tag }}
          TARGET_BRANCH: ${{ needs.check_mode.outputs.target_branch }}
          DISPLAY_NAME: ${{ needs.check_mode.outputs.display_name }}
          DESCRIPTION: ${{ needs.check_mode.outputs.description }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          if [ -n "$CHANGELOG" ]; then
            # attached to the release next to the packages (it fails here if the path is wrong)
            cp "$CHANGELOG" "release-files/CHANGELOG-${RELEASE_TAG}.md"
          fi
          python ./scripts/modding/update_mod_catalog.py \
            --generate-release-notes release_notes.md \
            --changelog-file "${CHANGELOG}" \
            --branch "${TARGET_BRANCH}" \
            --tag "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --display-name "${DISPLAY_NAME}" \
            --description "${DESCRIPTION}" \
            --checksums-file release-files/SHA256SUMS.txt

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check_mode.outputs.release_tag }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE_INPUT" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists, updating notes and uploading assets with --clobber..."
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes-file release_notes.md $PRERELEASE_FLAG --repo "${{ github.repository }}"
            gh release upload "${RELEASE_TAG}" release-files/* --repo "${{ github.repository }}" --clobber
          else
            echo "Creating the release..."
            gh release create "${RELEASE_TAG}" \
              release-files/* \
              --title "${RELEASE_TAG}" \
              --notes-file release_notes.md \
              --repo "${{ github.repository }}" \
              $PRERELEASE_FLAG
          fi

      - name: Commit & Push Updated index.json to Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check_mode.outputs.release_tag }}
          TARGET_BRANCH: ${{ needs.check_mode.outputs.target_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update index.json for ${RELEASE_TAG}"
            git push origin "HEAD:${TARGET_BRANCH}" || echo "Warning: Could not push index.json directly to ref ${TARGET_BRANCH}"
          else
            echo "index.json already up to date on the branch."
          fi
